<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="10" fill="#111215"/>
  <!-- Split flap outer frame -->
  <rect x="8" y="6" width="48" height="52" rx="4" fill="#18191f" stroke="#2a2b34" stroke-width="2"/>
  <!-- Top half -->
  <path d="M 8 10 C 8 8 9 6 12 6 L 52 6 C 54 6 56 8 56 10 L 56 31 L 8 31 Z" fill="#1f2027"/>
  <!-- Bottom half -->
  <path d="M 8 33 L 56 33 L 56 54 C 56 56 54 58 52 58 L 12 58 C 9 58 8 56 8 54 Z" fill="#17181e"/>
  <!-- Center hinge/gap -->
  <rect x="6" y="31" width="52" height="2" fill="#0d0e11"/>
  <!-- Side hinge rivets -->
  <circle cx="9" cy="32" r="1.5" fill="#f59e0b"/>
  <circle cx="55" cy="32" r="1.5" fill="#f59e0b"/>
  <!-- Amber Split flap character ($ or digit) -->
  <text x="32" y="42" font-family="'IBM Plex Mono', monospace, sans-serif" font-size="34" font-weight="700" fill="#f59e0b" text-anchor="middle">⏱</text>
</svg>